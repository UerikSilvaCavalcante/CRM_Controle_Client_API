version: '3.9'

services:
  # rodar imagem de um redis
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - db-network
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    
    env_file:
      - .env
    
    networks:
      - db-network
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  
  redis-data:
    driver: local
networks:
  db-network:
    driver: bridge
